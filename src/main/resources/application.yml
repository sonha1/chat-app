server:
  port: 2001
  tomcat:
    accept-count: 1000
spring:
  application:
    name: Chat-App
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jpa:
    database: mysql
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/chat_app
    username: root
    password: sonha1
    hikari:
      pool-name: HikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 60000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 0
jwt:
  prefix: Bearer
  secret: secret@bdc
  refreshSecret: secretfR@Wmc
  validity: 86400

logging:
  level:
    org:
      springframework:
        security=DEBUG: